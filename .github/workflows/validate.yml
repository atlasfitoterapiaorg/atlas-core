name: Validate Atlas Core

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontmatter:
    name: Validate Front Matter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate Front Matter
        run: python tools/validate_frontmatter.py .

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Markdown
        run: python tools/validate_markdown.py

  validate-naming:
    name: Validate Naming
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate Naming
        run: python tools/validate_naming.py

  validate-links:
    name: Validate Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Links
        run: python tools/validate_links.py
  
  validate-ids:
    name: Validate IDs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate IDs
        run: python tools/validate_ids.py


  validate-knowledge:
    name: Validate knowledge compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current Atlas Core
        uses: actions/checkout@v6
        with:
          path: atlas-core

      - name: Checkout reference knowledge
        uses: actions/checkout@v6
        with:
          repository: atlasfitoterapiaorg/atlas-knowledge
          ref: develop
          path: atlas-knowledge

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate entities and relationships
        run: python atlas-core/tools/validate_entities.py atlas-knowledge
