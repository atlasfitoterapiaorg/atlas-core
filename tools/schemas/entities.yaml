version: 1.0.0

entities:

  taxon:
    name: Taxón
    prefix: TAX
    id_pattern: "^TAX-(FAM|GEN|SP|SSP|VAR|FOR)-\\d{6}$"
    sequence_scope: taxonomic_rank
    required_fields:
      - id
      - title
      - type
      - taxonomic_level
      - scientific_name
      - governance_status
      - relationships
      - external_ids
      - provenance
    taxonomic_ranks:
      family: FAM
      genus: GEN
      species: SP
      subspecies: SSP
      variety: VAR
      form: FOR

  plant_part:
    name: Parte vegetal
    prefix: PVE
    id_pattern: "^PVE-\\d{6}$"
    sequence_scope: entity_type

  herbal_drug:
    name: Droga vegetal
    prefix: DVE
    id_pattern: "^DVE-\\d{6}$"
    sequence_scope: entity_type

  herbal_preparation:
    name: Preparado vegetal
    prefix: PRE
    id_pattern: "^PRE-\\d{6}$"
    sequence_scope: entity_type

  chemical_compound:
    name: Compuesto químico
    prefix: COM
    id_pattern: "^COM-\\d{6}$"
    sequence_scope: entity_type

  chemical_class:
    name: Clase química
    prefix: CLQ
    id_pattern: "^CLQ-\\d{6}$"
    sequence_scope: entity_type

  biological_activity:
    name: Actividad biológica
    prefix: ACB
    id_pattern: "^ACB-\\d{6}$"
    sequence_scope: entity_type

  mechanism_of_action:
    name: Mecanismo de acción
    prefix: MEC
    id_pattern: "^MEC-\\d{6}$"
    sequence_scope: entity_type

  therapeutic_use:
    name: Uso terapéutico
    prefix: UTE
    id_pattern: "^UTE-\\d{6}$"
    sequence_scope: entity_type

  health_condition:
    name: Condición de salud
    prefix: CSA
    id_pattern: "^CSA-\\d{6}$"
    sequence_scope: entity_type

  interaction:
    name: Interacción
    prefix: INT
    id_pattern: "^INT-\\d{6}$"
    sequence_scope: entity_type

  study:
